<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jiyuu Prototype</title>
<meta name="description" content="Clickable design prototype for Jiyuu, a minimal short-form social network. All content is synthetic." />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231d9bf0'/%3E%3Cpath d='M10 9l6 8 6-8M16 17v7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
/* ---------- Tokens ---------- */
:root {
  --bg: #ffffff;
  --bg-2: #f7f8f9;
  --bg-3: #eff1f3;
  --bg-elev: #ffffff;
  --line: #e6e8eb;
  --line-2: #cfd5da;
  --text: #0f1419;
  --text-2: #536471;
  --text-3: #6b7885;
  --accent: #1d9bf0;
  --accent-text: #0070c9;
  --accent-fill: #0070c9;
  --accent-fill-hover: #005ea9;
  --accent-soft: rgba(29, 155, 240, 0.1);
  --accent-soft-2: rgba(29, 155, 240, 0.18);
  --unread: rgba(29, 155, 240, 0.06);
  --on-accent: #ffffff;
  --like: #d4146c;
  --like-soft: rgba(249, 24, 128, 0.1);
  --repost: #007f55;
  --repost-soft: rgba(0, 186, 124, 0.12);
  --danger: #d92c2c;
  --danger-soft: rgba(217, 44, 44, 0.08);
  --danger-fill: #d92c2c;
  --backdrop: rgba(15, 20, 25, 0.42);
  --shadow-pop: 0 1px 2px rgba(15, 20, 25, 0.06), 0 8px 28px rgba(15, 20, 25, 0.14);
  --shadow-modal: 0 2px 6px rgba(15, 20, 25, 0.06), 0 24px 64px rgba(15, 20, 25, 0.22);
  --av-l: 88%;
  --av-s: 55%;
  --av-tl: 28%;
  --img-fallback: #e3e7eb;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans JP", sans-serif;
  --r-card: 16px;
  --r-md: 12px;
  --r-sm: 8px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --nav-w: 248px;
  --main-w: 600px;
  --rail-w: 330px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --bg-2: #1d1d20; --bg-3: #242428; --bg-elev: #1f1f22;
    --line: #2c2c31; --line-2: #3d3d44;
    --text: #ececef; --text-2: #9a9aa3; --text-3: #8b8b94;
    --accent-text: #4cb0f5; --accent-fill: #0a6fcf; --accent-fill-hover: #1a7fdd;
    --accent-soft: rgba(29, 155, 240, 0.14); --accent-soft-2: rgba(29, 155, 240, 0.24); --unread: rgba(29, 155, 240, 0.06);
    --like: #f7508f; --like-soft: rgba(247, 80, 143, 0.14);
    --repost: #2fc48d; --repost-soft: rgba(47, 196, 141, 0.14);
    --danger: #f4575a; --danger-soft: rgba(244, 87, 90, 0.12); --danger-fill: #c62828;
    --backdrop: rgba(0, 0, 0, 0.6);
    --shadow-pop: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.5);
    --shadow-modal: 0 2px 6px rgba(0, 0, 0, 0.4), 0 24px 64px rgba(0, 0, 0, 0.6);
    --av-l: 28%; --av-s: 28%; --av-tl: 84%;
    --img-fallback: #2a2a2f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161618; --bg-2: #1d1d20; --bg-3: #242428; --bg-elev: #1f1f22;
  --line: #2c2c31; --line-2: #3d3d44;
  --text: #ececef; --text-2: #9a9aa3; --text-3: #8b8b94;
  --accent-text: #4cb0f5; --accent-fill: #0a6fcf; --accent-fill-hover: #1a7fdd;
  --accent-soft: rgba(29, 155, 240, 0.14); --accent-soft-2: rgba(29, 155, 240, 0.24); --unread: rgba(29, 155, 240, 0.06);
  --like: #f7508f; --like-soft: rgba(247, 80, 143, 0.14);
  --repost: #2fc48d; --repost-soft: rgba(47, 196, 141, 0.14);
  --danger: #f4575a; --danger-soft: rgba(244, 87, 90, 0.12); --danger-fill: #c62828;
  --backdrop: rgba(0, 0, 0, 0.6);
  --shadow-pop: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.5);
  --shadow-modal: 0 2px 6px rgba(0, 0, 0, 0.4), 0 24px 64px rgba(0, 0, 0, 0.6);
  --av-l: 28%; --av-s: 28%; --av-tl: 84%;
  --img-fallback: #2a2a2f;
  color-scheme: dark;
}

/* ---------- Daylight theme ----------
   Every token is written inline on the root element by applyDaylight(). Registering the color tokens
   lets them transition, so minute ticks drift and the dawn/dusk band flip cross-fades. */
@property --bg { syntax: "<color>"; inherits: true; initial-value: #fff; }
@property --bg-2 { syntax: "<color>"; inherits: true; initial-value: #f7f8f9; }
@property --bg-3 { syntax: "<color>"; inherits: true; initial-value: #eff1f3; }
@property --bg-elev { syntax: "<color>"; inherits: true; initial-value: #fff; }
@property --line { syntax: "<color>"; inherits: true; initial-value: #e6e8eb; }
@property --line-2 { syntax: "<color>"; inherits: true; initial-value: #cfd5da; }
@property --text { syntax: "<color>"; inherits: true; initial-value: #0f1419; }
@property --text-2 { syntax: "<color>"; inherits: true; initial-value: #536471; }
@property --text-3 { syntax: "<color>"; inherits: true; initial-value: #6b7885; }
@property --accent { syntax: "<color>"; inherits: true; initial-value: #1d9bf0; }
@property --accent-text { syntax: "<color>"; inherits: true; initial-value: #0070c9; }
@property --accent-fill { syntax: "<color>"; inherits: true; initial-value: #0070c9; }
@property --accent-soft { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --img-fallback { syntax: "<color>"; inherits: true; initial-value: #e3e7eb; }
@property --accent-soft-2 { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --accent-fill-hover { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --unread { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --like { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --like-soft { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --repost { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --repost-soft { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --danger { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --danger-soft { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --danger-fill { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --backdrop { syntax: "<color>"; inherits: true; initial-value: transparent; }
:root[data-theme="time"] {
  transition: --bg 1.4s ease, --bg-2 1.4s ease, --bg-3 1.4s ease, --bg-elev 1.4s ease, --line 1.4s ease, --line-2 1.4s ease,
    --text 1.4s ease, --text-2 1.4s ease, --text-3 1.4s ease, --accent 1.4s ease, --accent-text 1.4s ease,
    --accent-fill 1.4s ease, --accent-soft 1.4s ease, --img-fallback 1.4s ease, --accent-soft-2 1.4s ease, --accent-fill-hover 1.4s ease, --unread 1.4s ease, --like 1.4s ease, --like-soft 1.4s ease, --repost 1.4s ease, --repost-soft 1.4s ease, --danger 1.4s ease, --danger-soft 1.4s ease, --danger-fill 1.4s ease, --backdrop 1.4s ease;
}
@media (prefers-reduced-motion: reduce) { :root[data-theme="time"] { transition: none; } }
:root[data-theme="time"][data-scrubbing] { transition: none; } /* follow the preview slider thumb directly */

/* ---------- Clear mode (transparent, for Zen's transparent browser) ----------
   A layer on top of any theme: the theme still decides text color (light = dark ink, dark = white ink).
   Page-level surfaces go transparent so the window's own blur shows through; overlays (menus, modals,
   drawer, composer, viewer, toast) keep the opaque --bg/--bg-elev. Flat greys become tints of --text so
   hovers, borders and chips read on any wallpaper and still work inside the opaque overlays.
   !important because the Daylight theme writes these tokens inline. */
:root[data-clear] {
  --bg-2: color-mix(in srgb, var(--text) 6%, transparent) !important;
  --bg-3: color-mix(in srgb, var(--text) 10%, transparent) !important;
  --line: color-mix(in srgb, var(--text) 16%, transparent) !important;
  --line-2: color-mix(in srgb, var(--text) 28%, transparent) !important;
  --img-fallback: color-mix(in srgb, var(--text) 10%, transparent) !important;
  /* Secondary greys pushed toward the ink: an unknown wallpaper eats mid-grey contrast. */
  --text-2: color-mix(in srgb, var(--text) 84%, var(--bg)) !important;
  --text-3: color-mix(in srgb, var(--text) 76%, var(--bg)) !important;
  --ring: color-mix(in srgb, var(--text) 18%, transparent);
  background: transparent;
}
[data-clear] body,
[data-clear] .auth-art,
[data-clear] .onb,
[data-clear] .onb-card,
[data-clear] .dm-compose,
[data-clear] .btn-google { background: transparent; }
/* Sticky bars stay fully clear: clipUnderBars() clips scrolling content at the bar's edge,
   so nothing ever sits beneath them. (An in-page backdrop-filter would only blur page pixels.) */
[data-clear] .bar,
[data-clear] .tabbar { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
[data-clear] .rail .search { box-shadow: none; }
[data-clear] .search:focus-within { background: var(--bg-3); }
/* Fake cut-out rings painted in --bg would show as solid rings on glass. */
[data-clear] .badge { box-shadow: none; }
[data-clear] .av-stack .av,
[data-clear] .av-group .av { box-shadow: 0 0 0 2px var(--ring); }
[data-clear] .p-top .p-av,
[data-clear] .onb-av .cam { border-color: var(--ring); }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--line-2) transparent; scrollbar-gutter: stable; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased;
  caret-color: var(--accent);
}
::selection { background: var(--accent-soft-2); color: inherit; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--text-2); }
.lnk { color: var(--accent-text); }
.lnk:hover { text-decoration: underline; text-underline-offset: 2px; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.lg { width: 24px; height: 24px; }
.ico.sm { width: 16px; height: 16px; }
.ico.xs { width: 14px; height: 14px; }
.ico.fill { fill: currentColor; }

/* ---------- Logo ---------- */
.wordmark { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: var(--text); }
.wordmark b { color: var(--accent); font-weight: 800; }
.mark { display: inline-grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; flex: none; }
.mark svg { width: 56%; height: 56%; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Avatars ---------- */
.av {
  --size: 40px; width: var(--size); height: var(--size); border-radius: 50%; flex: none;
  display: grid; place-items: center; overflow: hidden;
  background: hsl(var(--h, 210) var(--av-s) var(--av-l)); color: hsl(var(--h, 210) 45% var(--av-tl));
  font-weight: 700; font-size: calc(var(--size) * 0.38); letter-spacing: -0.01em; user-select: none;
}
.av.s24 { --size: 24px; } .av.s32 { --size: 32px; } .av.s36 { --size: 36px; } .av.s44 { --size: 44px; }
.av.s48 { --size: 48px; } .av.s64 { --size: 64px; } .av.s96 { --size: 96px; } .av.s134 { --size: 134px; }
.av-stack { display: flex; }
.av-stack .av { box-shadow: 0 0 0 2px var(--bg); }
.av-stack .av + .av { margin-left: -8px; }
.av-group { position: relative; width: 44px; height: 44px; flex: none; }
.av-group .av { position: absolute; --size: 28px; font-size: 10px; box-shadow: 0 0 0 2px var(--bg); }
.av-group .av:first-child { top: 0; left: 0; }
.av-group .av:last-child { bottom: 0; right: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: 15px;
  white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s, opacity .15s;
}
.btn.sm { height: 32px; padding: 0 14px; font-size: 14px; }
.btn.lg { height: 48px; padding: 0 24px; font-size: 16px; }
.btn.block { width: 100%; }
.btn-primary { background: var(--accent-fill); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-fill-hover); }
.btn-primary:disabled { opacity: .45; cursor: default; background: var(--accent-fill); }
.btn-ink { background: var(--text); color: var(--bg); }
.btn-ink:hover { opacity: .88; }
.btn-outline { border: 1px solid var(--line-2); background: transparent; }
.btn-outline:hover { background: var(--bg-2); }
.btn-danger { background: var(--danger-fill); color: #fff; }
.btn-danger:hover { opacity: .9; }
.btn-danger-outline { border: 1px solid var(--danger); color: var(--danger); }
.btn-follow.is-following:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  color: var(--text); transition: background-color .15s, color .15s; flex: none;
}
.icon-btn:hover { background: var(--bg-3); }
.icon-btn.accent { color: var(--accent-text); }
.icon-btn.accent:hover { background: var(--accent-soft); }
.icon-btn:disabled { opacity: .4; cursor: default; background: none; }

/* ---------- Shell ---------- */
.shell { display: flex; justify-content: center; min-height: 100vh; }
.side {
  width: var(--nav-w); flex: none; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; padding: 16px 20px 20px 12px; gap: 4px;
}
.side-brand { display: flex; align-items: center; gap: 10px; padding: 6px 12px 18px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 16px; padding: 10px 12px; border-radius: 10px;
  font-size: 17px; color: var(--text); transition: background-color .15s;
}
.nav-item:hover { background: var(--bg-2); }
.nav-item[aria-current="page"] { font-weight: 700; }
.nav-item .badge { position: absolute; left: 26px; top: 5px; }
.badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent-fill); color: #fff;
  font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg);
}
.side .btn-compose { margin: 16px 0 0; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.acct-chip {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border-radius: 999px; text-align: left;
  transition: background-color .15s;
}
.acct-chip:hover { background: var(--bg-2); }
.acct-chip .who { min-width: 0; flex: 1; line-height: 1.25; }
.acct-chip .who b, .acct-chip .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-chip .who span { color: var(--text-2); font-size: 14px; }

.main {
  width: var(--main-w); flex: none; min-height: 100vh;
  border-left: 1px solid var(--line); border-right: 1px solid var(--line);
}
.rail { width: var(--rail-w); flex: none; padding: 8px 0 32px 28px; position: sticky; top: 0; height: 100vh; overflow-y: auto; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.shell.wide .main { width: calc(var(--main-w) + var(--rail-w)); display: flex; border-right: 1px solid var(--line); }
.shell.wide .rail { display: none; }

/* sticky page header */
.bar {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.bar-row { display: flex; align-items: center; gap: 16px; min-height: 53px; padding: 0 16px; }
.bar-row h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.01em; line-height: 1.2; }
.bar-row .sub { font-size: 13px; color: var(--text-2); }
.bar-row .grow { flex: 1; min-width: 0; }
.mobile-top { display: none; }

/* tabs */
.tabs { display: flex; }
.tab {
  flex: 1; display: grid; place-items: center; height: 52px; color: var(--text-2); font-weight: 500;
  transition: background-color .15s; position: relative;
}
.tab:hover { background: var(--bg-2); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 700; }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; bottom: 0; height: 4px; width: 56px; border-radius: 2px; background: var(--accent);
}

/* ---------- Rail ---------- */
.search {
  display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 999px;
  background: var(--bg-3); color: var(--text-2); border: 1px solid transparent;
}
.search:focus-within { background: var(--bg); border-color: var(--accent); color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font-size: 15px; }
.search input::placeholder { color: var(--text-3); }
.rail .search { position: sticky; top: 0; margin: 0 0 16px; box-shadow: 0 0 0 8px var(--bg); z-index: 2; }
.panel { border: 1px solid var(--line); border-radius: var(--r-card); margin-bottom: 16px; overflow: hidden; }
.panel h2 { font-size: 19px; font-weight: 800; margin: 0; padding: 12px 16px 6px; letter-spacing: -0.01em; }
.panel-more { display: block; padding: 14px 16px; color: var(--accent-text); transition: background-color .15s; }
.panel-more:hover { background: var(--bg-2); }
.trend { display: block; padding: 10px 16px; transition: background-color .15s; }
.trend:hover { background: var(--bg-2); }
.trend .ctx { font-size: 13px; color: var(--text-2); }
.trend .tag { font-weight: 700; display: block; margin: 1px 0; }
.trend .count { font-size: 13px; color: var(--text-2); }
.rail-foot { font-size: 13px; color: var(--text-3); padding: 0 16px; line-height: 1.8; }
.rail-foot a:hover { text-decoration: underline; }
.synthetic-note { font-size: 12px; color: var(--text-3); padding: 8px 16px 0; }

/* user row */
.urow { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; transition: background-color .15s; cursor: pointer; }
.urow:hover { background: var(--bg-2); }
.urow .info { flex: 1; min-width: 0; line-height: 1.3; }
.urow .nm { font-weight: 700; display: flex; align-items: center; gap: 4px; }
.urow .nm span, .urow .hd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.urow .hd { color: var(--text-2); display: flex; gap: 6px; align-items: center; }
.urow .bio { margin-top: 4px; font-size: 15px; }
.urow .btn { margin-top: 2px; }
.pill-tag { font-size: 12px; font-weight: 500; background: var(--bg-3); color: var(--text-2); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }

/* ---------- Posts ---------- */
.post { border-bottom: 1px solid var(--line); padding: 12px 16px 4px; cursor: pointer; transition: background-color .15s; }
.post:hover { background: color-mix(in srgb, var(--bg-2) 70%, transparent); }
.post.has-next { border-bottom: 0; }
.post.no-hover { cursor: default; } .post.no-hover:hover { background: none; }
.post-ctx { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; color: var(--text-2); margin: -2px 0 4px; }
.post-ctx .ctx-ico { width: 40px; display: flex; justify-content: flex-end; }
.post-ctx a:hover { text-decoration: underline; }
.post-row { display: flex; gap: 12px; }
.post-gutter { display: flex; flex-direction: column; align-items: center; flex: none; }
.thread-line { width: 2px; flex: 1; background: var(--line-2); margin-top: 4px; min-height: 12px; border-radius: 1px; }
.thread-line.up { position: absolute; }
.post-body { flex: 1; min-width: 0; }
.post-head { display: flex; align-items: center; gap: 4px; line-height: 20px; min-width: 0; }
.post-head .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
.post-head .nm:hover { text-decoration: underline; }
.post-head .meta { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
.post-head .time { color: var(--text-2); white-space: nowrap; flex: none; }
.post-head .time:hover { text-decoration: underline; }
.post-head .edited { color: var(--text-3); font-size: 13px; flex: none; }
.post-head .more { margin: -8px -8px -8px auto; color: var(--text-2); }
.post-head .more:hover { color: var(--accent-text); background: var(--accent-soft); }
.lock { display: inline-flex; color: var(--text); margin-left: 2px; }
.replying { color: var(--text-2); font-size: 15px; margin: 1px 0 2px; }
.post-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 2px 0 0; }
.post-loc { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); font-size: 13px; margin-top: 10px; }
.post-loc:hover { color: var(--accent-text); }

.actions { display: flex; justify-content: space-between; max-width: 440px; margin: 6px 0 0 -8px; }
.act {
  display: inline-flex; align-items: center; gap: 2px; color: var(--text-2); font-size: 13px; height: 34px;
  padding-right: 8px; transition: color .15s;
}
.act .hit { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; transition: background-color .15s; }
.act.reply:hover, .act.share:hover, .act.bm:hover { color: var(--accent-text); }
.act.reply:hover .hit, .act.share:hover .hit, .act.bm:hover .hit { background: var(--accent-soft); }
.act.rp:hover, .act.rp.on { color: var(--repost); }
.act.rp:hover .hit { background: var(--repost-soft); }
.act.like:hover, .act.like.on { color: var(--like); }
.act.like:hover .hit { background: var(--like-soft); }
.act.bm.on { color: var(--accent-text); }
.act.on .ico { fill: currentColor; }
.act.rp.on .ico { fill: none; stroke-width: 2.4; }
.act:disabled { opacity: .5; cursor: not-allowed; }
.act.like.popping .ico { animation: heart-pop .42s var(--ease-out); }
@keyframes heart-pop { 0% { transform: scale(1); } 30% { transform: scale(.7); } 65% { transform: scale(1.22); } 100% { transform: scale(1); } }
.act-right { display: flex; }

/* media */
.media { margin-top: 12px; border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--line); display: grid; gap: 2px; background: var(--line); }
.media.n1 { grid-template-columns: 1fr; }
.media.n2 { grid-template-columns: 1fr 1fr; aspect-ratio: 16/9; }
.media.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 16/9; }
.media.n3 .m:first-child { grid-row: span 2; }
.media.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 16/9; }
.media .m { position: relative; background: var(--img-fallback); min-height: 0; overflow: hidden; }
.media.n1 .m { aspect-ratio: 16/10; max-height: 510px; }
.media .m img { width: 100%; height: 100%; object-fit: cover; }
/* carousel (multi-photo posts): bleeds into the avatar gutter, first slide aligns with text */
.car { position: relative; margin: 12px -16px 0 -68px; }
.post-text:empty { display: none; }
.post-text:empty + .car { margin-top: 8px; }
.car-track {
  display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 68px 16px;
  padding: 0 16px 0 68px; scrollbar-width: none; overscroll-behavior-x: contain;
}
.car-track::-webkit-scrollbar { display: none; }
.car-item {
  flex: none; height: var(--car-h, 290px); aspect-ratio: var(--r); max-width: 82%; padding: 0; scroll-snap-align: start;
  border-radius: var(--r-card); overflow: hidden; background: var(--img-fallback); border: 1px solid var(--line);
}
.car-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.car-nav {
  position: absolute; top: 50%; translate: 0 -50%; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(15, 20, 25, .72); color: #fff; backdrop-filter: blur(6px); opacity: 0; transition: opacity .15s;
}
.car-nav.prev { left: 76px; } .car-nav.next { right: 24px; }
.car:hover .car-nav { opacity: 1; }
.car.at-start .car-nav.prev, .car.at-end .car-nav.next { opacity: 0; pointer-events: none; }
@media (hover: none) { .car-nav { display: none; } }
.focus .car { margin: 12px -16px 0; }
.focus .car-track { padding: 0 16px; scroll-padding-inline: 16px; }
/* avatar makes room when a text-less carousel scrolls under it */
.post-gutter .av { transition: transform .22s cubic-bezier(.2, .8, .2, 1); transform-origin: 50% 0; }
.post.av-tuck .post-gutter .av { transform: scale(var(--tuck, .7)); }
.media .m[data-act] { cursor: zoom-in; }

.gif-badge {
  position: absolute; left: 10px; bottom: 10px; background: rgba(0, 0, 0, .72); color: #fff; font-size: 12px; font-weight: 800;
  padding: 2px 6px; border-radius: 4px; letter-spacing: .04em;
}
.alt-badge { position: absolute; right: 10px; bottom: 10px; background: rgba(0, 0, 0, .72); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }

/* link card */
.link-card { display: block; margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; transition: background-color .15s; }
.link-card:hover { background: var(--bg-2); }
.link-card .thumb { aspect-ratio: 1.91/1; background: var(--img-fallback); border-bottom: 1px solid var(--line); }
.link-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.link-card .lc-body { padding: 10px 14px 12px; line-height: 1.3; }
.link-card .dom { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
.link-card .ttl { margin: 2px 0; font-weight: 500; }
.link-card .dsc { font-size: 14px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* quote */
.quote { display: block; margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; transition: background-color .15s; }
.quote:hover { background: var(--bg-2); }
.quote .post-head { font-size: 15px; }
.quote .post-text { font-size: 15px; }
.quote .media { margin-top: 8px; border-radius: 10px; }
.quote-hidden { color: var(--text-2); }

/* poll */
.poll { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.poll-opt {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 36px;
  padding: 0 12px; border-radius: var(--r-sm); overflow: hidden; text-align: left; width: 100%;
}
.poll-opt.vote { border: 1px solid var(--accent-fill); color: var(--accent-text); font-weight: 700; justify-content: center; border-radius: 999px; transition: background-color .15s; }
.poll-opt.vote:hover { background: var(--accent-soft); }
.poll-opt .fillbar { position: absolute; inset: 0; background: var(--bg-3); border-radius: var(--r-sm); transform-origin: left; transform: scaleX(var(--pct, 0)); animation: grow .6s var(--ease-out); }
@keyframes grow { from { transform: scaleX(0); } }
.poll-opt.win .fillbar { background: var(--accent-soft-2); }
.poll-opt span { position: relative; display: flex; align-items: center; gap: 6px; }
.poll-opt.win span { font-weight: 700; }
.poll-meta { color: var(--text-2); font-size: 14px; }

/* collapsed / notice rows */
.notice-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--text-2); }
.notice-row .grow { flex: 1; }
.notice-row button { color: var(--accent-text); font-weight: 700; }
.show-thread { display: block; padding: 4px 16px 14px 68px; color: var(--accent-text); border-bottom: 1px solid var(--line); font-size: 15px; }
.show-thread:hover { text-decoration: underline; }
.new-pill {
  position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%); width: max-content; display: flex; align-items: center; gap: 8px;
  background: var(--accent-fill); color: #fff; font-weight: 700; font-size: 14px; border-radius: 999px; padding: 6px 14px 6px 8px; box-shadow: var(--shadow-pop);
  opacity: 0; pointer-events: none; translate: 0 -6px; transition: opacity .25s, translate .35s var(--ease-out);
}
.scrolled .new-pill { opacity: 1; pointer-events: auto; translate: 0 0; }

/* inline composer on home */
.inline-compose { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: text; }
.inline-compose .ph { flex: 1; font-size: 20px; color: var(--text-3); padding: 8px 0; }
.inline-compose .row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }

/* focused post */
.focus { padding: 12px 16px 0; border-bottom: 1px solid var(--line); }
.focus .fhead { display: flex; gap: 12px; align-items: center; }
.focus .fhead .who { flex: 1; min-width: 0; line-height: 1.3; }
.focus .fhead .nm { font-weight: 700; display: flex; gap: 4px; align-items: center; }
.focus .fhead .hd { color: var(--text-2); }
.focus .post-text { font-size: 17px; line-height: 1.45; margin-top: 12px; }
.focus .fmeta { color: var(--text-2); padding: 14px 0; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px; }
.focus .fstats { display: flex; gap: 20px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--text-2); }
.focus .fstats b { color: var(--text); font-weight: 700; }
.focus .actions { max-width: none; padding: 4px 4px; margin: 0; justify-content: space-between; }
.focus .act-right { display: contents; }
.focus .act { padding-right: 0; }
.focus .act .hit { width: 38px; height: 38px; }
.focus .act .ico { width: 20px; height: 20px; }
.reply-limit { display: flex; gap: 10px; align-items: center; padding: 12px 16px; color: var(--text-2); border-bottom: 1px solid var(--line); font-size: 14px; }
.reply-limit .ico { color: var(--accent-text); }
.reply-box { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.reply-box .ph { flex: 1; color: var(--text-3); font-size: 17px; cursor: text; }

/* ---------- Profile ---------- */
.p-header { aspect-ratio: 3/1; background: var(--img-fallback); overflow: hidden; }
.p-header img { width: 100%; height: 100%; object-fit: cover; }
.p-top { padding: 12px 16px 0; position: relative; }
.p-top .p-av { margin-top: -80px; border: 4px solid var(--bg); border-radius: 50%; width: max-content; }
.p-actions { position: absolute; right: 16px; top: 12px; display: flex; gap: 8px; }
.p-name { font-size: 20px; font-weight: 800; margin: 12px 0 0; display: flex; align-items: center; gap: 6px; letter-spacing: -0.01em; }
.p-handle { color: var(--text-2); display: flex; gap: 8px; align-items: center; }
.p-bio { margin: 12px 0 0; white-space: pre-wrap; }
.p-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-2); margin-top: 12px; }
.p-meta span, .p-meta a { display: inline-flex; gap: 4px; align-items: center; }
.p-counts { display: flex; gap: 20px; margin: 12px 0 0; }
.p-counts a { color: var(--text-2); font-size: 15px; }
.p-counts a b { color: var(--text); }
.p-counts a:hover { text-decoration: underline; }
.p-tabs { margin-top: 8px; border-bottom: 1px solid var(--line); }
.pinned-lbl { color: var(--text-2); }
.m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding-top: 2px; }
.m-tile { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--img-fallback); }
.m-tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .15s; }
.m-tile:hover img { opacity: .88; }
.m-tile .gif-badge { left: 6px; bottom: 6px; font-size: 11px; }
.m-multi { position: absolute; top: 6px; right: 6px; color: #fff; filter: drop-shadow(0 0 1px rgba(0,0,0,.8)) drop-shadow(0 1px 3px rgba(0,0,0,.5)); }

/* ---------- Photo viewer ---------- */
.viewer { position: fixed; inset: 0; z-index: 120; background: rgba(0, 0, 0, .9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: #fff; display: flex; flex-direction: column; animation: fade .18s ease-out; }
.vw-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.vw-count { font-size: 15px; font-weight: 600; }
.vw-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255, 255, 255, .1); transition: background-color .15s; }
.vw-btn:hover { background: rgba(255, 255, 255, .2); }
.vw-track { flex: 1; min-height: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.vw-track::-webkit-scrollbar { display: none; }
.vw-slide { flex: none; width: 100%; height: 100%; display: grid; place-items: center; padding: 0 64px; scroll-snap-align: center; position: relative; }
.vw-slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
.vw-nav { position: absolute; top: 50%; translate: 0 -50%; }
.vw-nav.prev { left: 16px; } .vw-nav.next { right: 16px; }
.viewer.at-start .vw-nav.prev, .viewer.at-end .vw-nav.next { visibility: hidden; }
.vw-bar { padding: 4px 16px calc(8px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
.vw-bar .actions { width: 100%; max-width: 560px; margin: 0; }
.vw-bar .act { color: rgba(255, 255, 255, .85); }

/* ---------- Empty ---------- */
.empty { padding: 48px 32px; max-width: 420px; margin: 0 auto; }
.empty h2 { font-size: 28px; line-height: 1.15; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
.empty p { color: var(--text-2); margin: 0 0 24px; }
.section-h { font-size: 20px; font-weight: 800; padding: 12px 16px; margin: 0; letter-spacing: -0.01em; }

/* ---------- Notifications ---------- */
.nrow { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background-color .15s; }
.nrow:hover { background: var(--bg-2); }
.nrow .n-ico { width: 40px; display: flex; justify-content: flex-end; flex: none; padding-top: 2px; }
.nrow .n-ico.like { color: var(--like); }
.nrow .n-ico.rp { color: var(--repost); }
.nrow .n-ico.fol { color: var(--accent-text); }
.nrow .n-body { flex: 1; min-width: 0; }
.nrow .n-text { margin-top: 8px; }
.nrow .n-text b { font-weight: 700; }
.nrow .n-snip { color: var(--text-2); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nrow.unread { background: var(--unread); }
.req-card { border-bottom: 1px solid var(--line); }
.req-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; transition: background-color .15s; width: 100%; text-align: left; }
.req-head:hover { background: var(--bg-2); }
.req-head .grow { flex: 1; }
.req-head .sub { color: var(--text-2); font-size: 14px; }
.req-list .urow { padding-left: 68px; cursor: default; }
.req-list .urow:hover { background: none; }
.req-btns { display: flex; gap: 8px; }

/* ---------- Messages ---------- */
.dm-list { width: 390px; flex: none; border-right: 1px solid var(--line); min-height: 100vh; }
.dm-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; }
.dm-row { display: flex; gap: 12px; padding: 14px 16px; cursor: pointer; transition: background-color .15s; position: relative; align-items: flex-start; }
.dm-row:hover { background: var(--bg-2); }
.dm-row[aria-current="true"] { background: var(--bg-2); }
.dm-row .info { flex: 1; min-width: 0; }
.dm-row .top { display: flex; gap: 4px; align-items: baseline; min-width: 0; }
.dm-row .top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm-row .top span { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-row .prev { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.dm-row.unread .prev { color: var(--text); font-weight: 600; }
.dm-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 8px; flex: none; }
.dm-empty { flex: 1; display: grid; place-items: center; padding: 32px; }
.dm-empty .empty { padding: 0; }
.chat { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 2px; }
.chat-intro { text-align: center; padding: 20px 0 28px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.chat-intro .av, .chat-intro .av-stack { margin: 0 auto 8px; justify-content: center; }
.chat-intro b { display: block; font-size: 17px; }
.chat-intro span { color: var(--text-2); font-size: 14px; }
.day-sep { text-align: center; color: var(--text-2); font-size: 13px; margin: 14px 0 10px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 78%; position: relative; }
.msg.mine { align-self: flex-end; flex-direction: row-reverse; }
.msg .av { --size: 28px; margin-bottom: 20px; }
.msg .av.ghost { visibility: hidden; }
.msg-col { display: flex; flex-direction: column; min-width: 0; align-items: flex-start; }
.msg.mine .msg-col { align-items: flex-end; }
.msg-sender { font-size: 13px; color: var(--text-2); margin: 8px 0 2px 12px; }
.bubble {
  background: var(--bg-3); padding: 9px 14px; border-radius: 20px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35;
}
.msg.mine .bubble { background: var(--accent-fill); color: #fff; }
.msg.mine .bubble .lnk { color: #fff; text-decoration: underline; }
.bubble.media-b { padding: 0; overflow: hidden; background: var(--img-fallback); width: 280px; max-width: 100%; aspect-ratio: 4/3; position: relative; border-radius: 18px; }
.bubble.media-b img { width: 100%; height: 100%; object-fit: cover; }
.reply-ref { font-size: 13px; color: var(--text-2); display: flex; gap: 4px; align-items: center; margin: 6px 12px 3px; }
.reply-ref-b { font-size: 13px; background: transparent; border: 1px solid var(--line); color: var(--text-2); padding: 6px 12px; border-radius: 16px; margin-bottom: -10px; padding-bottom: 14px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-time { font-size: 12px; color: var(--text-3); margin: 3px 12px 6px; }
.reacts { display: flex; gap: 4px; margin-top: -6px; position: relative; z-index: 1; padding: 0 8px; }
.react-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
.react-chip.me { border-color: var(--accent); background: var(--accent-soft); }
.msg-tools { display: flex; gap: 0; opacity: 0; transition: opacity .15s; align-self: center; }
.msg:hover .msg-tools, .msg:focus-within .msg-tools { opacity: 1; }
.msg-tools .icon-btn { width: 30px; height: 30px; color: var(--text-2); }
.react-picker { display: flex; gap: 2px; padding: 4px; background: var(--bg-elev); border-radius: 999px; box-shadow: var(--shadow-pop); border: 1px solid var(--line); }
.react-picker button { width: 34px; height: 34px; border-radius: 50%; font-size: 18px; transition: background-color .15s, transform .15s; }
.react-picker button:hover { background: var(--bg-3); transform: scale(1.12); }
.dm-compose { border-top: 1px solid var(--line); padding: 8px 12px; background: var(--bg); }
.dm-compose .replying-to { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); padding: 4px 6px 8px; }
.dm-compose .replying-to .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm-field { display: flex; align-items: center; gap: 2px; background: var(--bg-3); border-radius: 22px; padding: 4px 4px 4px 6px; }
.dm-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 8px 6px; }
.dm-field input::placeholder { color: var(--text-3); }
.dm-attach { display: flex; gap: 8px; padding: 0 4px 8px; }
.dm-attach .thumb { position: relative; width: 72px; height: 72px; border-radius: 12px; overflow: hidden; background: var(--img-fallback); }
.dm-attach .thumb img { width: 100%; height: 100%; object-fit: cover; }
.dm-attach .thumb button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; display: grid; place-items: center; }

/* ---------- Overlays ---------- */
.backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.modal {
  width: 600px; max-width: 100%; background: var(--bg); border-radius: var(--r-card); box-shadow: var(--shadow-modal);
  animation: rise .28s var(--ease-out); position: relative; margin-bottom: 5vh;
}
.modal.sm { width: 380px; margin-top: 20vh; }
.modal.md { width: 460px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 53px; }
.modal-head h2 { font-size: 20px; font-weight: 800; margin: 0; flex: 1; letter-spacing: -0.01em; }
.modal-body { padding: 4px 16px 16px; }
.modal-foot { display: flex; gap: 10px; padding: 12px 16px 16px; }
.confirm { padding: 28px 28px 24px; }
.confirm h2 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
.confirm p { color: var(--text-2); margin: 0 0 22px; }
.confirm .btn { width: 100%; height: 44px; margin-top: 10px; }

.pop {
  position: fixed; z-index: 120; min-width: 240px; max-width: 320px; background: var(--bg-elev); border-radius: var(--r-md);
  box-shadow: var(--shadow-pop); border: 1px solid var(--line); padding: 6px 0; animation: popin .16s var(--ease-out); transform-origin: top right;
}
@keyframes popin { from { opacity: 0; transform: scale(.96); } }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; font-weight: 600; font-size: 15px; text-align: left; transition: background-color .12s; }
.menu-item:hover, .menu-item:focus-visible { background: var(--bg-2); outline: none; }
.menu-item.danger { color: var(--danger); }
.menu-item .grow { flex: 1; }
.menu-item .sub { display: block; font-weight: 400; font-size: 13px; color: var(--text-2); }

/* ============================================================
   Views

/**
 * Select top-level feed posts. Following includes the current account's posts,
 * followed authors, and reposts by followed accounts, newest first. For You
 * keeps source order and only includes the current account's posts when fresh.
 */
function feedPosts(tab) {
  const all = POSTS.filter(p => !p.replyTo && !(p.thread && threadPosts(p.thread)[0] !== p));
  if (tab === "following") {
    return all.filter(p => S.following.has(p.by) || p.by === ME || (p.repostedBy && S.following.has(p.repostedBy))).sort((a, b) => a.ago - b.ago);
  }
  return all.filter(p => p.by !== ME || p.fresh);
}
function renderFeedList(list) {
  return list.map(p => p.thread ? renderThreadPreview(p) : renderPost(p)).join("");
}
function viewHome() {
  const tab = S.feedTab;
  const list = feedPosts(tab);
  const tabs = `<div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="${tab === "foryou"}" data-act="feed-tab" data-v="foryou">For You</button>
    <button class="tab" role="tab" aria-selected="${tab === "following"}" data-act="feed-tab" data-v="following">Following</button></div>`;
  const pill = tab === "following" ? "" : `<button class="new-pill" data-act="new-posts">${`<span class="av-stack">${avatar("sora", "s24")}${avatar("hanakim", "s24")}</span>`}3 new posts</button>`;
  return `<div class="bar">${mobileTop()}<div class="bar-row desk-only"><h1>Home</h1></div>${tabs}${pill}</div>
    <div class="inline-compose desk-inline" data-act="compose">${avatar(ME)}<div style="flex:1"><div class="ph">What’s happening?</div>
      <div class="row"><div style="display:flex;color:var(--accent-text)">${icon("image")}&nbsp;&nbsp;${icon("gif")}&nbsp;&nbsp;${icon("poll")}&nbsp;&nbsp;${icon("pin")}</div><span class="btn btn-primary sm" aria-hidden="true" style="opacity:.45">Post</span></div></div></div>
    ${renderFeedList(list)}`;
}
function viewPost(id) {
  const p = post(id);
  if (!p) return `<div class="bar">${pageBar("Post", "", { back: true, mobileToo: true })}</div><div class="empty"><h2>This post doesn’t exist</h2><p>It may have been deleted.</p></div>`;
  const ancestors = [];
  let cur = p;
  while (cur.replyTo) { cur = post(cur.replyTo); if (!cur) break; ancestors.unshift(cur); }
  const threadNext = p.thread ? threadPosts(p.thread).filter(x => x.replyTo === p.id) : [];
  const replies = repliesOf(p.id).filter(r => !threadNext.includes(r));
  return `<div class="bar">${pageBar("Post", "", { back: true, mobileToo: true })}</div>
    ${ancestors.map(a => renderPost(a, { next: true })).join("")}
    ${renderFocus(p)}
    ${threadNext.map(t => renderThreadChain(t)).join("")}
    ${replies.map(r => renderReplyChain(r)).join("")}`;
}
function renderThreadChain(start) {
  const chain = [start];
  let n = start;
  while ((n = POSTS.find(x => x.replyTo === n.id && x.thread === start.thread))) chain.push(n);
  return chain.map((c, i) => renderPost(c, { next: i < chain.length - 1 })).join("");
}
function renderReplyChain(r) {
  const child = repliesOf(r.id)[0];
  return child ? renderPost(r, { next: true }) + renderPost(child) : renderPost(r);
}
function renderFocus(p) {
  if (isHidden(p)) return `<div class="empty"><h2>Post unavailable</h2><p>You blocked or muted this account.</p></div>`;
  const u = user(p.by);
  const liked = S.liked.has(p.id), rp = S.reposted.has(p.id);
  const ctl = p.replyCtl || "everyone";
  const followBtn = p.by !== ME ? followButton(p.by, "sm") : "";
  const limit = ctl !== "everyone" ? `<div class="reply-limit">${icon(REPLY_CTL[ctl].icon, "sm")}<span>${ctl === "following" ? `Accounts @${p.by} follows can reply` : `Only accounts @${p.by} mentioned can reply`}</span></div>` : "";
  const replyBox = canReply(p) ? `<div class="reply-box" data-act="reply" data-id="${p.id}">${avatar(ME)}<span class="ph">Post your reply</span><span class="btn btn-primary sm" style="opacity:.45">Reply</span></div>` : "";
  return `<article class="focus">
    ${renderPostContext(p)}
    <div class="fhead"><a href="#/profile/${p.by}">${avatar(p.by, "s48")}</a>
      <div class="who"><a class="nm" href="#/profile/${p.by}">${esc(u.name)}${nameBadges(p.by)}</a><div class="hd">@${p.by}</div></div>
      ${followBtn}<button class="icon-btn" data-act="post-menu" data-id="${p.id}" aria-label="More options">${icon("more", "sm")}</button></div>
    ${renderReplying(p)}
    <div class="post-text">${richText(p.text)}</div>
    ${renderMedia(p)}${renderPoll(p)}${renderLink(p)}${renderQuote(p)}
    <div class="fmeta"><span>${fmtFull(p.ago)}</span>${p.loc ? `<span>· <a class="lnk" href="#/explore?q=${encodeURIComponent(p.loc)}">${esc(p.loc)}</a></span>` : ""}${p.edited ? "<span>· Edited</span>" : ""}</div>
    <div class="fstats num"><span><b>${fmtNum(p.c.rp + (rp ? 1 : 0))}</b> Reposts</span><span><b>${fmtNum(p.c.q)}</b> Quotes</span><span><b>${fmtNum(p.c.l + (liked ? 1 : 0))}</b> Likes</span></div>
    ${renderActions(p, false)}
  </article>${limit}${replyBox}`;
}

function followState(h) {
  if (S.blocked.has(h)) return "blocked";
  if (S.following.has(h)) return "following";
  if (S.requested.has(h)) return "requested";
  return "none";
}
function followButton(h, size = "") {
  const st = followState(h);
  if (st === "blocked") return `<button class="btn btn-danger-outline ${size}" data-act="unblock" data-h="${h}">Blocked</button>`;
  if (st === "following") return `<button class="btn btn-outline btn-follow is-following ${size}" data-act="unfollow" data-h="${h}" data-hover="Unfollow">Following</button>`;
  if (st === "requested") return `<button class="btn btn-outline ${size}" data-act="cancel-request" data-h="${h}">Requested</button>`;
  const label = user(h).followsMe ? "Follow back" : "Follow";
  return `<button class="btn btn-ink ${size}" data-act="follow" data-h="${h}">${label}</button>`;
}
function renderUserRow(h, opts = {}) {
  const u = user(h);
  const fy = u.followsMe ? '<span class="pill-tag">Follows you</span>' : "";
  const right = opts.right ?? (h === ME ? "" : followButton(h, "sm"));
  return `<div class="urow" data-go="#/profile/${h}">${avatar(h)}
    <div class="info"><div class="nm"><span>${esc(u.name)}</span>${nameBadges(h)}</div><div class="hd"><span>@${h}</span>${fy}</div>
    ${!opts.compact && u.bio ? `<div class="bio">${richText(u.bio.split("\n")[0])}</div>` : ""}</div>${right}</div>`;
}

function viewProfile(h, sub) {
  const u = user(h);
  if (!u) return `<div class="bar">${pageBar("Profile", "", { back: true, mobileToo: true })}</div><div class="empty"><h2>This account doesn’t exist</h2><p>Try searching for another.</p></div>`;
  if (sub === "followers" || sub === "following") return viewFollowList(h, sub);
  const own = h === ME;
  const blocked = S.blocked.has(h);
  const locked = u.private && !own && !S.following.has(h);
  const count = Math.max(POSTS.filter(p => p.by === h && !p.replyTo).length, u.posts || 0);
  return `<div class="bar">${pageBar(esc(u.name) + (u.private ? " " + icon("lock", "xs") : ""), `<span class="num">${fmtNum(count)} ${count === 1 ? "post" : "posts"}</span>`, { back: true, mobileToo: true })}</div>
    <div class="p-header">${blocked ? "" : photo(u.header, "Header image (placeholder)", 1200, 400)}</div>
    <div class="p-top">
      <div class="p-av">${avatar(h, "s134")}</div>
      <div class="p-actions">${profileActions(h)}</div>

}
function profileActions(h) {

  const dm = S.blocked.has(h) ? "" : `<button class="icon-btn btn-outline" style="border:1px solid var(--line-2)" data-act="dm-user" data-h="${h}" aria-label="Message">${icon("mail", "sm")}</button>`;
  return `<button class="icon-btn" style="border:1px solid var(--line-2)" data-act="profile-menu" data-h="${h}" aria-label="More">${icon("more", "sm")}</button>${dm}${followButton(h)}`;

function renderBlockedProfile(h) {
  return `<div class="empty" style="border-top:1px solid var(--line);margin-top:16px;max-width:none"><h2>You blocked @${h}</h2><p>They can’t follow you, see your posts, or message you. Their posts won’t appear anywhere for you.</p><button class="btn btn-ink" data-act="unblock" data-h="${h}">Unblock</button></div>`;

function renderLockedProfile(h) {

  return `<div style="border-top:1px solid var(--line);margin-top:16px"><div class="empty" style="max-width:none"><h2>${icon("lock", "lg")} These posts are protected</h2><p>${note}</p></div></div>`;
}
function renderProfileTabs(h) {
  const t = S.profileTab;
  const tabs = [["posts", "Posts"], ["replies", "Replies"], ["media", "Media"], ["likes", "Likes"]];
  const tabBar = `<div class="tabs p-tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${t === k}" data-act="profile-tab" data-v="${k}">${l}</button>`).join("")}</div>`;
  return tabBar + profileTabContent(h, t);
}
function profileTabContent(h, t) {
  const mine = POSTS.filter(p => p.by === h);
  if (t === "posts") {
    const pinned = mine.find(p => p.pinnedPost);
    const rest = mine.filter(p => !p.replyTo && p !== pinned).sort((a, b) => a.ago - b.ago);
    const reposts = h === ME ? [...S.reposted].map(post).filter(Boolean).map(p => ({ ...p, repostedBy: ME })) : [];
    return (pinned ? renderPost(pinned, { ctx: "pinned" }) : "") + reposts.map(p => renderPost(p)).join("") + rest.map(p => p.thread ? renderThreadPreview(p) : renderPost(p)).join("") || emptyTab("No posts yet", "When they post, it’ll show up here.");
  }
  if (t === "replies") {
    const r = mine.filter(p => p.replyTo && !p.thread);
    return r.map(p => renderPost(p)).join("") || emptyTab("No replies yet", "Replies to other posts will show up here.");
  }
  if (t === "media") {
    const m = mine.filter(p => p.images || p.gif).sort((a, b) => a.ago - b.ago);
    return m.length ? `<div class="m-grid">${m.map(mediaTile).join("")}</div>` : emptyTab("No photos or videos", "Posts with images and GIFs will show up here.");
  }
  const likes = h === ME ? [...S.liked].map(post).filter(Boolean) : [];
  return likes.map(p => renderPost(p)).join("") || emptyTab(h === ME ? "You haven’t liked any posts" : "Likes are private", h === ME ? "Tap the heart on any post to show some love." : `Only @${h} can see what they like.`);
}
function mediaTile(p) {

function emptyTab(title, body) { return `<div class="empty"><h2>${title}</h2><p>${body}</p></div>`; }
function viewFollowList(h, which) {

function viewExplore(route) {
  const q = (route.q.get("q") || "").trim();
  const tab = route.q.get("tab") || (q ? "top" : "trending");
  const search = `<form class="search" data-form="search" role="search" style="margin:8px 16px">${icon("search", "sm")}<input name="q" value="${esc(q)}" placeholder="Search posts, people, #tags" aria-label="Search" autocomplete="off"></form>`;
  if (!q && tab !== "people") {
    return `<div class="bar">${search}</div>
      <h2 class="section-h">Trending</h2>${TRENDS.map(t => `<a class="trend" href="#/tag/${t.tag}" style="border-bottom:1px solid var(--line)"><span class="ctx">${t.ctx}</span><span class="tag">#${t.tag}</span><span class="count num">${fmtNum(t.n)} posts</span></a>`).join("")}

  const tabs = [["top", "Top"], ["latest", "Latest"], ["people", "People"], ["tags", "Tags"]];
  const tabBar = `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<a class="tab" role="tab" aria-selected="${tab === k}" href="#/explore?q=${encodeURIComponent(q)}&tab=${k}">${l}</a>`).join("")}</div>`;
  return `<div class="bar">${search}${tabBar}</div>${searchResults(q, tab)}`;
}
function searchResults(q, tab) {
  const needle = q.toLowerCase().replace(/^[#@]/, "");
  if (tab === "people") {
    const us = Object.keys(USERS).filter(h => h.includes(needle) || USERS[h].name.toLowerCase().includes(needle) || USERS[h].bio.toLowerCase().includes(needle));
    return us.map(h => renderUserRow(h)).join("") || emptyTab(`No people match “${esc(q)}”`, "Try a name or @handle.");
  }
  if (tab === "tags") {
    const tags = TRENDS.filter(t => t.tag.includes(needle));
    return tags.map(t => `<a class="trend" href="#/tag/${t.tag}" style="border-bottom:1px solid var(--line)"><span class="tag">#${t.tag}</span><span class="count num">${fmtNum(t.n)} posts</span></a>`).join("") || emptyTab(`No hashtags match “${esc(q)}”`, "");
  }
  let ps = POSTS.filter(p => (p.text + " " + (p.loc || "")).toLowerCase().includes(needle));
  if (tab === "latest") ps = ps.sort((a, b) => a.ago - b.ago);
  else ps = ps.sort((a, b) => b.c.l - a.c.l);
  return ps.map(p => renderPost(p)).join("") || emptyTab(`No results for “${esc(q)}”`, "Try different keywords, or check the spelling.");
}
function viewTag(tag) {

  const body = muted
    ? `<div class="empty"><h2>You muted #${esc(tag)}</h2><p>Posts with this hashtag are hidden from your feeds and notifications.</p><button class="btn btn-ink" data-act="unmute-word" data-w="${tag}">Unmute #${esc(tag)}</button></div>`
    : ps.map(p => renderPost(p)).join("") || emptyTab(`No posts with #${esc(tag)} yet`, "Be the first to use it.");
  return `<div class="bar">${pageBar("#" + esc(tag), t ? `<span class="num">${fmtNum(t.n)} posts</span>` : "", { back: true, mobileToo: true, right })}</div>${body}`;
}

function renderMsg(c, m, i) {
  const mine = m.from === ME;
  const prev = c.msgs[i - 1], next = c.msgs[i + 1];
  const group = c.members.length > 1;

  const sender = group && !mine && firstOfRun ? `<div class="msg-sender">${esc(user(m.from).name)}</div>` : "";
  const ref = m.replyTo !== undefined ? c.msgs[m.replyTo] : null;
  const refHtml = ref ? `<div class="reply-ref">${icon("cornerReply", "xs")} ${mine ? "You" : esc(user(m.from).name.split(" ")[0])} replied to ${ref.from === ME ? "yourself" : esc(user(ref.from).name.split(" ")[0])}</div><div class="reply-ref-b">${esc(ref.text || (ref.gif ? "GIF" : "Photo"))}</div>` : "";

  if (m.img) bubble = `<div class="bubble media-b">${photo(m.img, "Shared photo (placeholder)", 560, 420)}</div>`;
  else if (m.gif) bubble = `<div class="bubble media-b">${photo(m.gif, "GIF", 560, 420)}<span class="gif-badge">GIF</span></div>`;
  else bubble = `<div class="bubble">${richText(m.text)}</div>`;
  const reacts = m.reacts ? `<div class="reacts">${Object.entries(m.reacts).map(([e, us]) => `<button class="react-chip ${us.includes(ME) ? "me" : ""}" data-act="react" data-c="${c.id}" data-i="${i}" data-e="${e}">${e} <span class="num">${us.length}</span></button>`).join("")}</div>` : "";

  const av = !mine ? (lastOfRun ? avatar(m.from) : '<span class="av ghost"></span>') : "";
  return `<div class="msg ${mine ? "mine" : ""}">${av}<div class="msg-col">${sender}${refHtml}${bubble}${reacts}${lastOfRun ? `<div class="msg-time">${esc(m.t)}</div>` : ""}</div>${tools}</div>`;
}
function renderChat(c) {

/**
 * Return a status and message for a proposed handle: idle when empty, err for
 * invalid or taken names, and ok otherwise. The current handle is reusable.
 */
function handleStatus(v) {
  if (!v) return ["idle", "Letters, numbers, underscores, and periods. 3 to 20 characters."];
  if (!/^[a-z0-9_.]{3,20}$/i.test(v)) return ["err", "Use 3 to 20 letters, numbers, underscores, or periods."];
  if (USERS[v.toLowerCase()] && v.toLowerCase() !== ME || ["admin", "jiyuu", "support"].includes(v.toLowerCase())) return ["err", `@${v} is taken. Try another.`];
  return ["ok", `@${v} is available`];
}

function viewFor(route) {
  switch (route.name) {
    case "home": return viewHome();
    case "post": return viewPost(route.args[0]);
    case "profile": return viewProfile(route.args[0], route.args[1]);
    case "explore": return viewExplore(route);
    case "tag": return viewTag(route.args[0]);
    case "notifications": return viewNotifications();
    case "bookmarks": return viewBookmarks();
    default: return viewHome();
  }
}
/** Replace the app with the current hash route's view and, for content routes, its shell. */
function render() {
  const route = parseRoute();
  const app = document.getElementById("app");
  if (route.name === "auth") { app.innerHTML = viewAuth(); return; }
  if (route.name === "onboarding") { app.innerHTML = viewOnboarding(); return; }
  const isDM = route.name === "messages";
  const chatOpen = isDM && route.args[0] && route.args[0] !== "new";
  const shellCls = ["shell", isDM ? "wide" : "", chatOpen ? "chat-open" : ""].join(" ");
  const main = isDM ? viewMessages(route.args[0]) : viewFor(route);
  app.innerHTML = `<div class="${shellCls}">${renderSide(route)}<main class="main" id="main">${main}</main>${isDM ? "" : renderRail()}</div>${renderTabbar(route)}`;
  if (chatOpen) scrollChat();
  queueClip();
}

/* ============================================================
   Overlays: popover, modal, drawer, toast
   ============================================================ */
const layer = document.getElementById("layer");
let popAnchor = null;
function closeLayer() { layer.innerHTML = ""; popAnchor = null; document.body.style.overflow = ""; }
/**
 * Open and focus a popover aligned to an anchor's left or right edge.
 * Clamp its horizontal position and try above the anchor when space is short.
 */
function openPop(anchor, html, align = "right") {
  closeLayer();
  popAnchor = anchor;
  layer.innerHTML = `<div class="pop" role="menu">${html}</div>`;
  const pop = layer.firstElementChild;
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = align === "right" ? r.right - pw : r.left;
  left = Math.max(8, Math.min(left, innerWidth - pw - 8));
  let top = r.bottom + 4;
  if (top + ph > innerHeight - 8) top = Math.max(8, r.top - ph - 4);
  pop.style.left = left + "px";
  pop.style.top = top + "px";
  pop.querySelector("button, a")?.focus({ preventScroll: true });
}
function openModal(html, cls = "") {
  closeLayer();
  layer.innerHTML = `<div class="backdrop" data-act="backdrop"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = "hidden";
  const f = layer.querySelector("textarea, input:not([type=radio]):not([type=checkbox])");
  (f || layer.querySelector("button"))?.focus({ preventScroll: true });
}
function openDrawer(html) {
  closeLayer();
  layer.innerHTML = `<div class="drawer-back" data-act="backdrop"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="Account">${html}</div>`;
  document.body.style.overflow = "hidden";
}
let toastTimer;
/**
 * Replace the current toast with HTML content and clear it after 3.2 seconds.
 * An optional link supplies the displayed label and destination as a pair.
 */
function toast(msg, link) {
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast"><span>${msg}</span>${link ? `<a href="${link[1]}">${link[0]}</a>` : ""}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ""; }, 3200);
}

/* ---------- Carousel + photo viewer ---------- */
/**
 * Scroll a photo track by 60% of its width, or a full width in the viewer.
 * Do nothing without a track; negative direction moves toward previous photos.
 */
function stepTrack(track, dir) {
  if (!track) return;
  const step = track.classList.contains("vw-track") ? track.clientWidth : track.clientWidth * 0.6;
  track.scrollBy({ left: dir * step, behavior: "smooth" });
}
function onCarScroll(track) {
  const car = track.parentElement;
  const x = track.scrollLeft, max = track.scrollWidth - track.clientWidth;
  car.classList.toggle("at-start", x < 4);
  car.classList.toggle("at-end", x > max - 4);
  tuckAvatar(car, x > 4);
}
// Text-less posts put the carousel beside the avatar; once swiping starts, shrink the avatar so the photos pass under it.
function tuckAvatar(car, on) {
  const card = car.closest(".post");
  if (!card) return;
  if (on && !card.classList.contains("av-tuck")) {
    const room = car.getBoundingClientRect().top - card.querySelector(".post-gutter").getBoundingClientRect().top - 6;
    if (room >= 40) return;
    card.style.setProperty("--tuck", (Math.max(room, 20) / 40).toFixed(2));
  }
  card.classList.toggle("av-tuck", on);
}
function viewerSlides(p) {
  const srcs = p.gif ? [p.gif] : p.images;
  return srcs.map((s, k) => {
    const r = p.gif || srcs.length === 1 ? 1.6 : imgRatio(s);
    return `<div class="vw-slide" data-act="backdrop" role="group" aria-label="${k + 1} of ${srcs.length}">${photo(s, p.gif ? "Animated GIF" : "Photo (placeholder)", 1600, Math.round(1600 / r))}</div>`;
  });
}
function openViewer(p, i) {
  if (!p) return;
  const slides = viewerSlides(p);
  const multi = slides.length > 1;
  const nav = multi ? `<button class="vw-btn vw-nav prev" data-act="vw-step" data-dir="-1" aria-label="Previous photo">${icon("chevLeft")}</button>
    <button class="vw-btn vw-nav next" data-act="vw-step" data-dir="1" aria-label="Next photo">${icon("chevRight")}</button>` : "";
  closeLayer();
  layer.innerHTML = `<div class="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="vw-top"><button class="vw-btn" data-act="close" aria-label="Close">${icon("x")}</button>
      ${multi ? '<span class="vw-count num" aria-live="polite"></span>' : ""}<span style="width:40px"></span></div>
    <div class="vw-track">${slides.join("")}</div>${nav}
    <div class="vw-bar">${renderActions(p)}</div></div>`;
  document.body.style.overflow = "hidden";
  const track = layer.querySelector(".vw-track");
  track.scrollLeft = i * track.clientWidth;
  syncViewer(track);
  layer.querySelector(".vw-btn").focus();
}
function syncViewer(track) {
  const v = track.closest(".viewer"), n = track.children.length;
  const i = Math.round(track.scrollLeft / track.clientWidth);
  v.classList.toggle("at-start", i <= 0);
  v.classList.toggle("at-end", i >= n - 1);
  const c = v.querySelector(".vw-count");
  if (c) c.textContent = `${i + 1} / ${n}`;
}

/* ============================================================
   Composer
   ============================================================ */
let C = null;
function newDraft(text = "") { return { text, images: [], gif: null, poll: null, loc: null, panel: null }; }
function openComposer(mode = "new", target = null) {
  const edit = mode === "edit" ? post(target) : null;
  C = { mode, target, replyCtl: edit?.replyCtl || "everyone", drafts: [newDraft(edit ? edit.text : "")], focus: 0 };
  renderComposer();
}
function charState(n) { return n > LIMIT ? "over" : n > LIMIT - 20 ? "warn" : ""; }
function ringSvg(n) {
  const r = 9, circ = 2 * Math.PI * r, pct = Math.min(n / LIMIT, 1);
  const st = charState(n);
  return `<svg class="ring ${st} ${st ? "big" : ""}" viewBox="0 0 22 22" aria-hidden="true"><circle class="track" cx="11" cy="11" r="${r}"/><circle class="val" cx="11" cy="11" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - pct)}"/></svg>`;
}
function counterHtml(n) {
  const left = LIMIT - n;
  const st = charState(n);
  return `<span class="n num ${st}" aria-live="polite">${st ? left : ""}</span>${ringSvg(n)}`;
}
/**
 * Require content in every draft, at most 280 text characters per draft, and
 * at least two nonempty choices in each attached poll.
 */
function composerValid() {
  return C.drafts.every(d => (d.text.trim() || d.images.length || d.gif || d.poll) && d.text.length <= LIMIT && (!d.poll || d.poll.opts.filter(o => o.trim()).length >= 2));
}
function renderDraftAttachments(d, i) {
  let s = "";
  if (d.images.length) s += `<div class="cmp-attach">${d.images.map((seed, j) => `<div class="thumb">${photo(seed, "Attached photo", 300, 300)}<button class="thumb-x" data-act="rm-img" data-d="${i}" data-j="${j}" aria-label="Remove photo">${icon("x")}</button></div>`).join("")}</div>`;
  if (d.gif) s += `<div class="cmp-attach" style="grid-template-columns:1fr"><div class="thumb" style="aspect-ratio:16/9">${photo(d.gif, "GIF", 600, 338)}<span class="gif-badge">GIF</span><button class="thumb-x" data-act="rm-gif" data-d="${i}" aria-label="Remove GIF">${icon("x")}</button></div></div>`;
  if (d.poll) s += renderPollBuilder(d, i);
  if (d.loc) s += `<div><span class="loc-chip">${icon("pin", "xs")}${esc(d.loc)}<button data-act="rm-loc" data-d="${i}" aria-label="Remove location">${icon("x", "xs")}</button></span></div>`;
  if (d.panel === "gif") s += renderGifPicker(i);
  if (d.panel === "loc") s += renderLocPicker(i);

}
function renderPollBuilder(d, i) {

  return `<div class="cmp-poll">${opts}${d.poll.opts.length < 4 ? `<button class="btn btn-outline sm" style="align-self:flex-start" data-act="poll-add" data-d="${i}">${icon("plus", "sm")} Add choice</button>` : ""}
    <div class="poll-foot"><label>Poll length <select data-poll-len="${i}"><option>1 day</option><option>3 days</option><option selected>7 days</option></select></label><button class="lnk" style="color:var(--danger);font-weight:600" data-act="poll-remove" data-d="${i}">Remove poll</button></div></div>`;
}
function renderGifPicker(i) {
  return `<div class="picker"><div class="search">${icon("search", "sm")}<input placeholder="Search GIFs" aria-label="Search GIFs"></div>
    <div class="gif-grid">${GIFS.map(g => `<button data-act="pick-gif" data-d="${i}" data-g="${g}" aria-label="Choose GIF">${photo(g, "GIF", 200, 200)}</button>`).join("")}</div></div>`;
}
function renderLocPicker(i) {

    <div class="loc-list">${PLACES.map(([n, s]) => `<button data-act="pick-loc" data-d="${i}" data-v="${esc(n)}">${icon("pin")}<span><b>${esc(n)}</b><span class="sub">${esc(s)}</span></span></button>`).join("")}</div></div>`;
}
function renderDraft(d, i) {
  const last = i === C.drafts.length - 1;
  const ph = C.mode === "reply" ? "Post your reply" : C.mode === "quote" ? "Add a comment" : i === 0 ? "What’s happening?" : "Add another post";
  const line = !last ? '<div class="thread-line"></div>' : "";
  const rm = i > 0 ? `<button class="icon-btn" data-act="rm-draft" data-d="${i}" aria-label="Remove this post" style="align-self:flex-start">${icon("x", "sm")}</button>` : "";

    <div class="cmp-field"><textarea data-draft="${i}" placeholder="${ph}" rows="${i ? 2 : 3}" aria-label="Post text">${esc(d.text)}</textarea>
    ${i === 0 && C.mode === "quote" ? `<div class="cmp-quote">${renderQuote({ quote: C.target })}</div>` : ""}
    ${renderDraftAttachments(d, i)}</div>${rm}</div>`;
}
function composerHeader() {
  const label = { new: "Post", reply: "Reply", quote: "Post", edit: "Save" }[C.mode];
  const extra = C.drafts.length > 1 ? " all" : "";
  return `<div class="modal-head"><button class="icon-btn" data-act="close-composer" aria-label="Close">${icon("x")}</button><span style="flex:1"></span>
    ${C.mode === "new" ? '<button class="lnk" style="font-weight:700;margin-right:12px" data-act="toast" data-msg="Draft saved">Drafts</button>' : ""}
    <button class="btn btn-primary sm" id="cmp-submit" data-act="submit-post" ${composerValid() ? "" : "disabled"}>${label}${extra}</button></div>`;
}
function renderComposer() {
  const parent = C.mode === "reply" ? post(C.target) : null;
  const parentHtml = parent ? `<div class="cmp-parent"><div class="post-gutter">${avatar(parent.by)}<div class="thread-line"></div></div><div class="post-body">${renderPostHead(parent).replace(/<button[\s\S]*?<\/button>/, "")}<div class="post-text">${richText(parent.text)}</div><div class="replying" style="margin-top:12px">Replying to <span class="lnk">@${parent.by}</span></div></div></div>` : "";
  const ctl = REPLY_CTL[C.replyCtl];

  const noMedia = C.mode === "edit";
  const html = `${composerHeader()}<div class="modal-body" style="padding-bottom:0">${parentHtml}${C.drafts.map(renderDraft).join("")}${editNote}
    ${C.mode !== "reply" ? `<button class="cmp-reply-ctl" data-act="cmp-reply-ctl" ${C.mode === "edit" ? "disabled" : ""}>${icon(ctl.icon, "sm")} ${ctl.label}</button>` : ""}</div>
    <div class="cmp-toolbar">
      <button class="icon-btn" data-act="add-img" aria-label="Add photos" ${noMedia || d.images.length >= 4 || d.gif || d.poll ? "disabled" : ""}>${icon("image")}</button>
      <button class="icon-btn" data-act="add-gif" aria-label="Add GIF" ${noMedia || d.images.length || d.poll ? "disabled" : ""}>${icon("gif")}</button>
      <button class="icon-btn" data-act="add-poll" aria-label="Add poll" ${noMedia || d.images.length || d.gif || d.poll ? "disabled" : ""}>${icon("poll")}</button>
      <button class="icon-btn" data-act="toast" data-msg="Emoji picker opens here" aria-label="Add emoji">${icon("smile")}</button>
      <button class="icon-btn" data-act="add-loc" aria-label="Add location" ${noMedia ? "disabled" : ""}>${icon("pin")}</button>
      <span class="grow"></span>
      <div class="counter" id="cmp-counter">${counterHtml(total)}</div>
      ${C.mode === "new" || C.mode === "reply" ? `<span class="vsep"></span><button class="add-thread" data-act="add-draft" aria-label="Add another post to thread" ${d.text.trim() && C.drafts.length < 10 ? "" : "disabled"}>${icon("plus", "sm")}</button>` : ""}
    </div>`;
  if (layer.querySelector(".modal.composer")) layer.querySelector(".modal.composer").innerHTML = html;

  autosizeAll();
  focusDraft(C.focus);
}
function autosize(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
function autosizeAll() { layer.querySelectorAll("textarea[data-draft]").forEach(autosize); }
function focusDraft(i) {
  const t = layer.querySelector(`textarea[data-draft="${i}"]`);
  if (t) { t.focus({ preventScroll: true }); t.setSelectionRange(t.value.length, t.value.length); }
}
function onDraftInput(t) {
  const i = +t.dataset.draft;
  C.drafts[i].text = t.value;

  autosize(t);

/**
 * Ignore invalid drafts; otherwise edit text or add linked reply, quote, and
 * thread posts to in-memory data, then redraw and show confirmation.
 * @throws {TypeError} If a valid edit, reply, or quote targets a missing post.
 */
function submitComposer() {
  if (!composerValid()) return;
  if (C.mode === "edit") {
    const p = post(C.target);
    p.text = C.drafts[0].text; p.edited = true;
    closeLayer(); rerender(); toast("Post updated"); return;
  }
  const ids = [];
  const tid = C.drafts.length > 1 ? "t" + S.seq : null;
  C.drafts.forEach((d, i) => {
    const id = "n" + S.seq++;
    const p = { id, by: ME, ago: 0, text: d.text, c: { r: 0, rp: 0, l: 0, q: 0 }, fresh: true, replyCtl: C.replyCtl };
    if (d.images.length) p.images = d.images.slice();
    if (d.gif) p.gif = d.gif;
    if (d.loc) p.loc = d.loc;
    if (d.poll) p.poll = { opts: d.poll.opts.filter(o => o.trim()).map(o => [o, 0]), endsIn: "7 days left" };
    if (C.mode === "quote" && i === 0) { p.quote = C.target; post(C.target).c.q++; }
    if (C.mode === "reply" && i === 0) { p.replyTo = C.target; post(C.target).c.r++; }
    if (tid) { p.thread = tid; if (i > 0) p.replyTo = ids[i - 1]; }
    ids.push(id);
    POSTS.unshift(p);
  });
  const first = ids[0];
  const msg = C.mode === "reply" ? "Your reply was sent." : ids.length > 1 ? `Your thread of ${ids.length} posts was sent.` : "Your post was sent.";
  closeLayer(); C = null; rerender();
  toast(msg, ["View", "#/post/" + first]);
}

    return;
  }
  if (t.id === "dm-search") { newDM.q = t.value; renderNewDM(true); }
});
document.addEventListener("focusin", e => {
  if (e.target.matches("textarea[data-draft]") && C) {
    const i = +e.target.dataset.draft;
    if (C.focus !== i) { C.focus = i; document.getElementById("cmp-counter").innerHTML = counterHtml(C.drafts[i].text.length); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  const act = t.dataset.actChange;
  if (t.matches("[data-day-preview]")) document.documentElement.removeAttribute("data-scrubbing");
  if (act === "report-reason") { report.reason = t.value; document.getElementById("report-next").disabled = false; }
  if (act === "lang") { S.lang = t.value; toast(t.value === "ja" ? "表示言語を日本語に切り替えました (prototype: content stays English)" : "Language set to English"); }
  if (act === "dm-sel") {
    const h = t.value;
    newDM.sel = t.checked ? [...newDM.sel, h] : newDM.sel.filter(x => x !== h);
    if (newDM.sel.length > 50) { newDM.sel.pop(); t.checked = false; toast("Groups can have up to 50 people"); }
    const y = layer.querySelector('[style*="max-height:50vh"]')?.scrollTop || 0;
    renderNewDM();
    const list = layer.querySelector('[style*="max-height:50vh"]'); if (list) list.scrollTop = y;
  }
});
document.addEventListener("submit", e => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.form === "search") {
    const q = f.q.value.trim();
    go("#/explore" + (q ? "?q=" + encodeURIComponent(q) : ""));
  } else if (f.dataset.form === "dm") sendDM(f);
  else if (f.dataset.form === "onboard") {
    const [st] = handleStatus(S.handleDraft);
    if (st !== "err" && S.handleDraft) go("#/home");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && layer.innerHTML) {
    const innerPop = layer.querySelector(".backdrop ~ .pop");
    if (innerPop) { innerPop.remove(); return; }
    if (layer.querySelector(".composer")) return ACTIONS["close-composer"]();
    if (pendingCancel) return ACTIONS.close();
    closeLayer();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && C) submitComposer();
  if (layer.querySelector(".viewer") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) stepTrack(layer.querySelector(".vw-track"), e.key === "ArrowLeft" ? -1 : 1);
  const typing = e.target.closest("input, textarea, select, [contenteditable]");
  if (!typing && !layer.innerHTML && e.key === "n" && !["auth", "onboarding"].includes(parseRoute().name)) { e.preventDefault(); openComposer(); }
});
addEventListener("hashchange", () => {
  const r = parseRoute();
  if (r.name !== "messages") { S.dmReply = null; S.dmAttach = null; }
  if (r.name !== "profile") S.profileTab = "posts";
  closeLayer(); C = null;
  render(); scrollTo(0, 0);
});
addEventListener("resize", () => { if (popAnchor) closeLayer(); queueClip(); });
document.addEventListener("scroll", queueClip, { capture: true, passive: true });
new ResizeObserver(queueClip).observe(document.body); // image loads, votes etc. shift layout without a scroll
document.addEventListener("scroll", e => {
  const t = e.target;
  if (t.classList?.contains("car-track")) onCarScroll(t);
  else if (t.classList?.contains("vw-track")) syncViewer(t);
}, { capture: true, passive: true });
addEventListener("scroll", () => document.body.classList.toggle("scrolled", scrollY > 240), { passive: true });

document.addEventListener("visibilitychange", () => { if (!document.hidden && S.theme === "time") applyDaylight(); });
if (S.theme === "clear") { S.theme = "system"; S.clear = true; } // earlier prototype stored Clear as a theme
applyTheme();
applyClear();
render();
</script>
</body>
</html>
