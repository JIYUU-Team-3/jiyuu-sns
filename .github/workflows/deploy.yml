name: Deploy

# `development` is the deploy branch: every merge into it ships the production
# Worker (single-environment setup, see wrangler.jsonc).
on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Never cancel a deploy that is already running - a half-applied migration or a
# killed `wrangler deploy` is worse than waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: false
  DO_NOT_TRACK: 1

jobs:
  # Gate: the exact same lint/typecheck/test/build jobs that run on PRs.
  # A red build here means the deploy job never starts.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate & deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # Aikido Safe Chain blocks known-malicious packages at install time, so it
      # must be installed BEFORE pnpm install. The installer is pinned to a
      # release and checksum-verified, so the guard cannot itself be swapped out.
      # `--ci` sets up PATH shims instead of shell aliases.
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.20/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh
      - run: pnpm install --frozen-lockfile

      # Schema first, so the Worker never boots against a database it is newer than.
      - name: Apply D1 migrations
        run: pnpm exec drizzle-kit migrate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}

      # Posts from before hashtags were stored get their tags saved, so tag search
      # and trending include them. Only touches posts with a `#` and no saved tags,
      # so after the first deploy it finds nothing to do.
      - name: Save hashtags of older posts
        run: pnpm db:backfill-tags --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}

      # `wrangler types` (run by `pnpm run build`) bakes the keys from `.env`
      # into worker-configuration.d.ts, so without one the regenerated file is
      # missing them and the build fails. Only the key names matter, never the
      # values. Removed again immediately so the placeholder values cannot reach
      # the deploy step below - that one gets its credentials from secrets.
      - name: Build
        run: |
          cp -n .env.example .env
          pnpm run build
          rm -f .env

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4.132.0'
          command: deploy

      # Verification that the deploy is actually serving, not just that the
      # upload returned 200. Retries cover Cloudflare's propagation window.
      - name: Smoke check
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::wrangler did not report a deployment URL"
            exit 1
          fi
          echo "Checking $DEPLOY_URL"
          curl -sS -f --retry 6 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' "$DEPLOY_URL"

      # Same Playwright suite as CI, pointed at the deployment instead of a
      # local server (see playwright.config.ts).
      #
      # Tests tagged `@writes` are excluded: verifying a deploy must not create
      # data (users, sessions, ...) in the production database. Tag any e2e
      # test that writes with `@writes` so it only runs against local D1.
      # The same cache the CI unit-test job fills, so the browser is rarely downloaded here.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: E2E against the deployment
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project=chromium --grep-invert @writes

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-deploy
          path: playwright-report/
          retention-days: 30

      - name: Summary
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- URL: ${DEPLOY_URL:-_not deployed_}"
          } >> "$GITHUB_STEP_SUMMARY"
