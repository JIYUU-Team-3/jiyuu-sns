name: CI

# Runs on every PR, and is called by deploy.yml as the gate before deploying.
on:
  pull_request:
    branches: [development, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; the CI gate in front of a deploy is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # wrangler types / vite build should never phone home or prompt in CI
  WRANGLER_SEND_METRICS: false
  DO_NOT_TRACK: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Aikido Safe Chain blocks known-malicious packages at install time, so it
      # must be installed BEFORE pnpm install. The installer is pinned to a
      # release and checksum-verified, so the guard cannot itself be swapped out.
      # `--ci` sets up PATH shims instead of shell aliases.
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.20/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Aikido Safe Chain blocks known-malicious packages at install time, so it
      # must be installed BEFORE pnpm install. The installer is pinned to a
      # release and checksum-verified, so the guard cannot itself be swapped out.
      # `--ci` sets up PATH shims instead of shell aliases.
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.20/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh
      - run: pnpm install --frozen-lockfile
      # `pnpm audit`, not `npm audit`: this repo has no package-lock.json.
      # Fails the job on moderate or worse. The advisory database moves
      # independently of this repo, so this job can start failing on a commit
      # that changed nothing about the dependencies - that is intentional.
      - run: pnpm audit --audit-level moderate

  check:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Aikido Safe Chain blocks known-malicious packages at install time, so it
      # must be installed BEFORE pnpm install. The installer is pinned to a
      # release and checksum-verified, so the guard cannot itself be swapped out.
      # `--ci` sets up PATH shims instead of shell aliases.
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.20/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh
      - run: pnpm install --frozen-lockfile
      # `wrangler types` bakes the keys from `.env` into worker-configuration.d.ts,
      # so without one CI regenerates a file missing them and the typecheck fails.
      # Only the key names matter here, never the values - `.env.example` has them.
      - name: Seed .env for wrangler types
        run: cp -n .env.example .env
      - run: pnpm run check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Aikido Safe Chain blocks known-malicious packages at install time, so it
      # must be installed BEFORE pnpm install. The installer is pinned to a
      # release and checksum-verified, so the guard cannot itself be swapped out.
      # `--ci` sets up PATH shims instead of shell aliases.
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.20/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh
      - run: pnpm install --frozen-lockfile
      # The `client` vitest project runs in a real browser via @vitest/browser-playwright
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest --run

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Aikido Safe Chain blocks known-malicious packages at install time, so it
      # must be installed BEFORE pnpm install. The installer is pinned to a
      # release and checksum-verified, so the guard cannot itself be swapped out.
      # `--ci` sets up PATH shims instead of shell aliases.
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.20/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh
      - run: pnpm install --frozen-lockfile
      # `wrangler types` bakes the keys from `.env` into worker-configuration.d.ts,
      # so without one CI regenerates a file missing them and the typecheck fails.
      # Only the key names matter here, never the values - `.env.example` has them.
      - name: Seed .env for wrangler types
        run: cp -n .env.example .env
      - run: pnpm run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Aikido Safe Chain blocks known-malicious packages at install time, so it
      # must be installed BEFORE pnpm install. The installer is pinned to a
      # release and checksum-verified, so the guard cannot itself be swapped out.
      # `--ci` sets up PATH shims instead of shell aliases.
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.20/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh
      - run: pnpm install --frozen-lockfile
      # `wrangler types` bakes the keys from `.env` into worker-configuration.d.ts,
      # so without one CI regenerates a file missing them and the typecheck fails.
      # Only the key names matter here, never the values - `.env.example` has them.
      - name: Seed .env for wrangler types
        run: cp -n .env.example .env
      - run: pnpm exec playwright install --with-deps
      # playwright.config.ts serves this build via `pnpm preview:ci`
      # (wrangler --local: D1 is emulated, no Cloudflare credentials needed).
      - run: pnpm run build
      # The emulated D1 starts empty, so create the tables before the app boots:
      # src/hooks.server.ts binds D1 on every request.
      - name: Migrate the local database
        run: pnpm run db:reset:local
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
