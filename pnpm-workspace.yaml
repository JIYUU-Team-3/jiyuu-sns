allowBuilds:
  workerd: true
  esbuild: true
  # lefthook.yml relies on the postinstall script to install the git hooks.
  lefthook: true

# drizzle-kit still pulls the deprecated @esbuild-kit/core-utils, which pins
# esbuild ~0.18 — vulnerable to GHSA-67mh-4wv8-2f99. Force a patched esbuild so
# `pnpm audit` is clean and the pre-commit/CI gates stay meaningful.
overrides:
  '@esbuild-kit/core-utils>esbuild': '^0.25.0'
  'miniflare>undici': '^7.29.1'
  # svelte pins devalue 5.9.2, which six advisories cover (GHSA-j22f-vq7h-c4qm and others,
  # fixed in 5.9.3). SvelteKit already resolves a patched one; this brings svelte's copy along.
  # Drop it once svelte depends on >=5.9.3 itself.
  'svelte>devalue': '^5.9.3'
  'source-map-js': '>=1.2.2'
  'sharp': '>=0.35.5'
