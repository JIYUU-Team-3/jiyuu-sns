# SonarQube Cloud — Automatic Analysis configuration.
#
# Automatic Analysis reads THIS file (`.sonarcloud.properties`), and only from
# the repository's DEFAULT BRANCH. A `sonar-project.properties` file would be
# ignored entirely — that name is for CI-based scans. Values set here override
# whatever is configured in the SonarCloud UI.
#
# Consequence: these exclusions do not take effect on open pull requests until
# this file is merged into `development`.

# ---------------------------------------------------------------------------
# Excluded from analysis — generated output and build artifacts. Nothing here
# is hand-written, so findings against it cannot be acted on at the source.
# ---------------------------------------------------------------------------
sonar.exclusions=\
  drizzle/**,\
  src/lib/paraglide/**,\
  worker-configuration.d.ts,\
  .svelte-kit/**,\
  build/**,\
  .wrangler/**,\
  static/**,\
  project.inlang/**,\
  playwright-report/**,\
  blob-report/**,\
  test-results/**

# ---------------------------------------------------------------------------
# Exempt from duplicate-code detection — repetition here is expected and is
# what drove the "Duplication on New Code" gate failure.
# ---------------------------------------------------------------------------
sonar.cpd.exclusions=\
  drizzle/**,\
  tests/**,\
  **/*.spec.ts,\
  messages/**
